html,body{min-height:100vh;width:100%;}
body{

    background-position:center;

}
body::before {
    content: "";

    z-index: -1;
    background-image: var(--bg-url);
    background-size: cover;
    background-position: center;

body[data-theme="transparent-light"] { /* 通透浅 */

    --nav-blur: 12px;
    --text-color: #ffffff;
    --card-bg: rgba(0,0,0,0.18);

.navbar{
    width:100%;height:72px;
    display:flex;align-items:center;justify-content:center;
    padding:0 32px;
    background:var(--nav-bg);
    backdrop-filter:blur(var(--nav-blur));
    -webkit-backdrop-filter:blur(var(--nav-blur));
    border-bottom:1px solid rgba(255,255,255,0.12);
    color:var(--text-color);
    position:sticky;top:0;z-index:99;
}
.nav-title{font-size:22px;font-weight:700;}

.wrap{
    max-width:900px;margin:30px auto;padding:0 24px;
    color:var(--text-color);
}
.detail-card{
    background:var(--card-bg);
    backdrop-filter:blur(var(--card-blur));
    -webkit-backdrop-filter:blur(var(--card-blur));
    border-radius:18px;padding:24px;
    border:1px solid rgba(255,255,255,0.1);
    box-shadow:0 8px 26px rgba(0,0,0,0.12);
}
.head-row{display:flex;gap:18px;align-items:flex-start;margin-bottom:18px;}
.detail-icon{width:72px;height:72px;border-radius:14px;object-fit:cover;}
.info h1{font-size:24px;margin-bottom:6px;}
.category-text{opacity:0.75;font-size:14px;margin-bottom:8px;}

.tags-row{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:24px;}
.tag{
    font-size:12px;padding:4px 9px;border-radius:6px;
    background:var(--tag-bg);color:var(--text-color);
}

.desc-block{margin-bottom:24px;line-height:1.7;font-size:15px;}
.download-list{display:flex;flex-direction:column;gap:10px;}
.download-item{
    padding:12px 16px;border-radius:10px;
    background:var(--input-bg);
    backdrop-filter:blur(var(--card-blur));
    display:flex;justify-content:space-between;align-items:center;
}
.download-item a{color:var(--text-color);text-decoration:none;font-weight:500;}

@media(max-width:600px){
    .head-row{flex-direction:column;}
    .navbar{padding:0 16px;}
}
</style>

// 主题同步
function applyTheme(key){
    document.body.setAttribute("data-theme",key);
}
function getSystemTheme(){
    const dark = window.matchMedia('(prefers-color-scheme: dark)');
    return dark.matches ? "standard-dark":"standard-light";
}
const saved = localStorage.getItem(STORAGE_KEY);
applyTheme(saved ? saved : getSystemTheme());
window.matchMedia('(prefers-color-scheme: dark)').addEventListener("change",()=>{
